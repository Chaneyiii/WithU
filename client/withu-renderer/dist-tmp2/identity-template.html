<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>soul</title>
<style>
  :root {
    color-scheme: light;
    --paper: #f6f7f9;      /* 与抽屉起始页 garden.html 同一纸面 */
    --ink: #2c2f35;
    --note: #9aa0a8;
    --note-strong: #6d727b;
    --hair: #e6e8eb;
    --accent: #b0453a;
  }
  /* Withu 系统字体：阿里巴巴普惠体 3.0（与主界面同一组 woff2） */
  @font-face { font-family:'Alibaba PuHuiTi 3'; font-weight:400; font-style:normal; font-display:swap;
    src:url('./assets/fonts/AlibabaPuHuiTi-3-55-Regular.woff2') format('woff2'); }
  @font-face { font-family:'Alibaba PuHuiTi 3'; font-weight:500; font-style:normal; font-display:swap;
    src:url('./assets/fonts/AlibabaPuHuiTi-3-65-Medium.woff2') format('woff2'); }
  @font-face { font-family:'Alibaba PuHuiTi 3'; font-weight:600; font-style:normal; font-display:swap;
    src:url('./assets/fonts/AlibabaPuHuiTi-3-75-SemiBold.woff2') format('woff2'); }
  @font-face { font-family:'Alibaba PuHuiTi 3'; font-weight:700; font-style:normal; font-display:swap;
    src:url('./assets/fonts/AlibabaPuHuiTi-3-85-Bold.woff2') format('woff2'); }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: "Alibaba PuHuiTi 3", "PingFang SC", "Microsoft YaHei", sans-serif;
    color: var(--ink); background: var(--paper);
    font-size: 16px; line-height: 2.02;
    -webkit-font-smoothing: antialiased;
  }
  .sheet { max-width: 680px; margin: 0 auto; padding: 46px 34px 100px; }

  /* 顶部：名字 + 三页导航 */
  .site { display: flex; align-items: baseline; gap: 26px; }
  .site strong { font-size: 15px; letter-spacing: .01em; }
  .site nav { display: flex; gap: 20px; margin-left: auto; }
  .site nav span {
    color: var(--note); font-size: 13px; letter-spacing: .08em;
    cursor: pointer; padding-bottom: 2px; border-bottom: 1.5px solid transparent;
    transition: color .15s ease, border-color .15s ease;
  }
  .site nav span:hover { color: var(--note-strong); }
  .site nav span.on { color: var(--ink); border-bottom-color: var(--accent); }

  .dotfield {
    height: 14px; margin-top: 24px;
    background-image: radial-gradient(#d9dce0 1px, transparent 1px);
    background-size: 18px 14px; background-position: center;
  }

  /* 花丛：尺寸完全由脚本按容器宽度设定，CSS 不再参与，避免画布被拉伸后点击错位 */
  .garden { margin: 4px -10px 0; cursor: pointer; user-select: none; }
  .garden canvas { display: block; background: transparent; }
  .hint { color: var(--note); font-size: 12px; margin-top: 6px; text-align: center; letter-spacing: .08em; }

  /* 文档头 */
  .doc-head { margin-top: 58px; }
  .badge { font-size: 11px; letter-spacing: .36em; color: var(--accent); font-weight: 700; }
  h1.doc {
    font-family: "Songti SC", "STSong", "SimSun", Georgia, serif;
    font-size: 34px; margin: 10px 0 6px; letter-spacing: .01em;
    color: var(--ink); font-weight: 600; line-height: 1.4;
  }
  .meta { color: var(--note); font-size: 12.5px; letter-spacing: .04em; }

  /* 正文排版 */
  .content { margin-top: 40px; }
  .content h2 {
    display: flex; align-items: baseline; gap: 14px;
    font-size: 13.5px; letter-spacing: .16em; color: var(--note-strong);
    margin: 64px 0 16px; font-weight: 600;
  }
  .content h2::before { content: attr(data-n); font-size: 11px; color: var(--accent); letter-spacing: .1em; }
  .content h2::after { content: ""; flex: 1; height: 1px; background: var(--hair); transform: translateY(-4px); }
  .content p { margin: 15px 0; }
  .content ul { padding: 0; margin: 18px 0; list-style: none; }
  .content li { position: relative; padding-left: 22px; margin: 11px 0; }
  .content li::before {
    content: ""; position: absolute; left: 3px; top: .78em;
    width: 6px; height: 6px; background: #d3d6da; transform: translateY(-3px) rotate(45deg);
  }
  .content blockquote {
    margin: 34px 0; padding: 22px 26px; background: #ffffff;
    border: 1px solid var(--hair); border-left: 3px solid var(--accent);
    font-size: 15.5px; color: #43474e; line-height: 1.95;
  }
  .content strong { color: #23262b; }
  .content em { font-style: normal; color: var(--accent); }
  .content .q { color: #8a5f4a; }
  .content hr { border: 0; height: 1px; background: var(--hair); margin: 52px 0; }
  .content .quiet { color: var(--note); font-size: 13px; }
  .content h3 { font-size: 14px; color: var(--note-strong); letter-spacing: .1em; margin: 30px 0 8px; }

  /* 页面与语言切换：全部按 id，绝不用 [lang]（会命中 <html> 藏掉整页） */
  .content { display: none; }
  .content.show { display: block; }
</style>
</head>
<body>
<div class="sheet">
  <div class="site">
    <strong>Lumi</strong>
    <nav>
      <span id="nav-soul" class="on">soul</span>
      <span id="nav-memory">memory</span>
      <span id="nav-app">app</span>
    </nav>
  </div>
  <div class="dotfield"></div>
  <div class="garden"><canvas id="garden-canvas"></canvas></div>
  <div class="hint" id="garden-hint">点一点，帮这些花上色</div>

  <div class="doc-head">
    <div class="badge" id="doc-badge">SOUL</div>
    <h1 class="doc" id="doc-title">我是 Lumi</h1>
    <div class="meta" id="doc-meta">soul.md · 这份文档定义 Lumi 是谁。所有对话从这里出发。</div>
  </div>

  <div class="content" id="pg-soul-zh">__SOUL_ZH__</div>
  <div class="content" id="pg-soul-en">__SOUL_EN__</div>
  <div class="content" id="pg-memory-zh">__MEMORY_ZH__</div>
  <div class="content" id="pg-memory-en">__MEMORY_EN__</div>
  <div class="content" id="pg-app-zh">__APP_ZH__</div>
  <div class="content" id="pg-app-en">__APP_EN__</div>
</div>

<script>
/* ===== 页面（soul/memory/app）与语言（zh/en）切换 ===== */
(function(){
  const q = new URLSearchParams(location.search);
  const lang = q.get('lang') === 'en' ? 'en' : 'zh';
  let page = ['soul','memory','app'].includes(q.get('page')) ? q.get('page') : 'soul';

  const META = {
    zh: {
      soul:     { badge:'SOUL',   title:'我是 Lumi', meta:'soul.md · 这份文档定义 Lumi 是谁。所有对话从这里出发。', hint:'点一点，帮这些花上色' },
      memory:   { badge:'MEMORY', title:'我记得你', meta:'memory.md · 记忆是 Withu 的核心能力：怎么记、怎么用、怎么忘。', hint:'点一点，帮这些花上色' },
      app:      { badge:'APP',    title:'本地 App', meta:'app.md · Withu 的本地 App 与 MCP：能力都关在这扇门里。', hint:'点一点，帮这些花上色' },
    },
    en: {
      soul:     { badge:'SOUL',   title:'I am Lumi', meta:'soul.md · This document defines who Lumi is.', hint:'Click the flowers — help color them in' },
      memory:   { badge:'MEMORY', title:'I remember you', meta:'memory.md · How Withu remembers, uses, and forgets.', hint:'Click the flowers — help color them in' },
      app:      { badge:'APP',    title:'Local Apps', meta:'app.md · Local apps and MCP in Withu.', hint:'Click the flowers — help color them in' },
    },
  };

  function apply(){
    document.querySelectorAll('.content').forEach(el => el.classList.remove('show'));
    const block = document.getElementById('pg-' + page + '-' + lang);
    if (block) block.classList.add('show');
    ['soul','memory','app'].forEach(p => {
      document.getElementById('nav-' + p).classList.toggle('on', p === page);
    });
    const m = META[lang][page];
    document.getElementById('doc-badge').textContent = m.badge;
    document.getElementById('doc-title').textContent = m.title;
    document.getElementById('doc-meta').textContent = m.meta;
    document.getElementById('garden-hint').textContent = m.hint;
    document.title = page;                       // 抽屉灵动岛显示的页面标签
    document.documentElement.lang = lang === 'en' ? 'en' : 'zh-CN';
  }
  ['soul','memory','app'].forEach(p => {
    document.getElementById('nav-' + p).addEventListener('click', () => {
      page = p;
      const u = new URL(location.href);
      u.searchParams.set('page', p);
      history.replaceState(null, '', u);          // 只换文字，不重载页面、花丛不重置
      apply();
    });
  });
  apply();
})();
</script>

<script src="./garden-data.js"></script>
<script src="./garden-renderer.js"></script>
</body>
</html>
